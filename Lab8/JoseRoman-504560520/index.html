        <link rel="stylesheet" href="style.css">
    </head>

        <label id="nombre">Ingrese su nombre: </label>

                <span class="cerrar" onclick="cerrarAlerta()">&times;</span>
                <p>Rellena todos los campos!!</p>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
