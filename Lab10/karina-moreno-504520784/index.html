<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel= "stylesheet" href="style.css"> 
    <link rel= "icon" href="assets/romaicon.pngwing.png">
        <title>Conversor de Numeros Romanos</title>
</head>
<body>
    <header>
            
    </header>

    <main>
        <div class="container-title">
            <h1>Convertir numeros romanos a numeros naturales</h1>
            <p>* El rango de entrada válido va desde "I" hasta "MMMCMXCIX"</p>
        </div>
        <section class="container-input">
            <input id="ingresar" class="input-num-romano" type="text" placeholder="Escribe un numero romano"></input>

            <div class="container-button">
                <i class="gg-arrows-exchange-alt"></i>
                    <button type="submit" class="convert-button">
                        Convertir
                    </button>
            </div>
            <div class="container-output">
                <p class="output-num-natural" id="mostrar"> Numero natural equivalente</p>
            </div>
        </section>
        
    </main>
</body>
<script src="script.js"></script>
</html>
