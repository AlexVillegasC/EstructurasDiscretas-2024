<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Números</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Conversor de Números</h1>
        <div class="form">
            <label for="romanNumber">Número Romano:</label>
            <input type="text" id="romanNumber" placeholder="Ingrese un número romano">
            <button id="convertRomanButton">Convertir</button>
        </div>
        <div class="form">
            <label for="integerNumber">Número Natural:</label>
            <input type="text" id="integerNumber" placeholder="Ingrese un número natural">
            <button id="convertIntegerButton">Convertir</button>
        </div>
        <div class="result" id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
